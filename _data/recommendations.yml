- name: Shadi Altarsha
  role: Senior Software Engineer at Reddit Infra
  date: March 2, 2022
  text:
    - "I have worked very closely with Michal during my years at Jodel. A very smart and professional engineer. Always able to discover very tricky edge cases. Michal shipped a lot of great and big features which many iOS users are enjoying daily. Michal's technical solutions are very well engineered and clean. Was great working with Michal, and definitely would like to do it again."
- name: Luís Rodrigues Soares
  role: Lead Software Engineer at HERE Technologies
  date: June 26, 2019
  text:
    - "I had the pleasure of working with Michał Cichoń during my tenure as CTO at Jodel, from 2018 to 2019. Michał worked as a Software Engineer in Jodel's iOS Team, a role which he performed to the best of my satisfaction. As a Software Engineer he participated in all aspects of Jodel's software development processes and always delivered work of an exceptional quality."
    - "Perhaps the trait I enjoyed the most about working with Michał was his balanced approach to Software Engineering work. He always delivered high quality features with a great attention to detail, but always managed not to get lost in the parts which were not fundamental either to the problem at hand or to the user."
    - "Besides his work in application development, I would also highlight Michał's contributions to technical architectural discussions and product refinement meetings, where he always maintained a bias for solutions which were sustainable and yet required a low effort to bring to production."
    - "A great Engineer to work with, always available and ready to help in any circumstance, it was just a pleasure to have had Michał in my team; not only do I recommend Michał and his work, I would love the opportunity to work with him again."
- name: Jan Freisler
  role: GenAI Program Change Manager at Aptiv

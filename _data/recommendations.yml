    - "It was a pleasure to build innovative mobile banking solutions with Michal. I could always rely on his accurate assessment of the current project situation in the area of iOS applications. That is why we have succeeded in many implementation of mobile products."
- name: Michael Martens
  role: Freelancer with focus on digital product development
  date: June 30, 2017
  text:
    - "If you need a thinking iOS Developer, here you go!"

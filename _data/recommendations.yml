- name: Tero Saarinen
  role: Product Designer at ui.works®
  date: September 28, 2026
  text:
    - "Michał brings experimental, fun UI ideas to life, and he knows when to challenge them, offering alternatives based on performance and technical feasibility. He's equally invested in shipping new features and holding on to high coding standards, and he balances the two well. He's a great sparring partner, whether for early feasibility checks or reviewing technical documentation. In refinement meetings he proactively fills gaps and makes sure technical scope is clear before implementation starts."
    - "During our collaboration, he was an iOS engineer who actively shaped the code base to match the design system built in Figma. He was a key contributor to a real two-way exchange between design and engineering, ensuring that Figma and the implementation shared the same variable names, and that common components behaved as specified."
- name: Dmitry Miller
  role: Software Engineer at Jodel
  date: November 27, 2025
  text:
    - "I had the pleasure of working with Michal for more than three years, and he is a highly knowledgeable mobile software developer. His deep, hands-on understanding of the iOS ecosystem — from UIKit to SwiftUI, as well as performance optimization and architectural best practices — consistently shows in the quality of his work. Michal approaches every task with precision, ownership, and a strong focus on delivering the best possible solution."
- name: Mariam Abouelfadl
  role: Head of Mobile at Jodel
  date: November 7, 2025
  text:
    - "I had the pleasure of working with Michał for the past 4 years during part of his time as a Senior iOS Engineer at Jodel. I was his manager, and I can confidently say he is one of the strongest mobile engineers I’ve worked with. His depth of technical expertise consistently elevated the quality of our product."
    - "Beyond his technical skills, what really sets Michał apart is his ownership, reliability, and ability to collaborate across functions. He consistently took on complex features, navigated ambiguity with ease, and delivered clean, scalable solutions. He was also a go-to resource for the team — always willing to mentor, review code thoughtfully, and share knowledge generously."
    - "He was a true asset to our team. Any company would be lucky to have him — he brings not only engineering excellence but also humility, professionalism, and a positive attitude that uplifts everyone around him."
    - "I wholeheartedly recommend Michał. He will immediately add value wherever he goes."
